[package]
name = "fn-dsa-verify"
version = "0.1.0"
edition = "2021"
default-run = "fn-dsa-verify"

[dependencies]
jolt-sdk = { workspace = true, features = ["host"] }
# Pulls in the Keccak inline's `register_inlines!` so the tracer recognises
# the custom opcodes emitted by fn-dsa-comm-jolt's SHAKE backend.
jolt-inlines-keccak256 = { workspace = true, features = ["host"] }
tracing-subscriber.workspace = true
tracing.workspace = true
guest = { package = "fn-dsa-verify-guest", path = "./guest" }

# Host uses the umbrella `fn-dsa` crate so we can generate a keypair and a
# signature to hand to the guest. The guest itself depends only on
# `fn-dsa-vrfy` (verify-only path).
fn-dsa = { workspace = true }
# Resolves through `[patch.crates-io] fn-dsa-vrfy = ...` to
# `crates/fn-dsa-vrfy-jolt`, which adds `compute_hashed_key`,
# `hash_to_point`, `from_parts`, and `verify_with_precomputed_c`.
fn-dsa-vrfy = { workspace = true }
rand_chacha = { workspace = true }
rand = { workspace = true, default-features = false, features = ["std_rng"] }

# Used by the symbol-profile binary (src/bin/profile.rs) only.
object = { workspace = true, features = ["read"] }
rustc-demangle = "0.1"

[package.metadata.cargo-machete]
ignored = ["jolt-inlines-keccak256"]

[[bin]]
name = "fn-dsa-verify"
path = "src/main.rs"

[[bin]]
name = "fn-dsa-profile"
path = "src/bin/profile.rs"
