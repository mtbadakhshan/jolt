[package]
name = "fn-dsa-verify-guest"
version = "0.1.0"
edition = "2021"

[features]
guest = []

[dependencies]
jolt = { package = "jolt-sdk", path = "../../../jolt-sdk" }
# Resolves through `[patch.crates-io] fn-dsa-vrfy = ...` to
# `crates/fn-dsa-vrfy-jolt`, which adds `from_parts` and
# `verify_with_precomputed_c`.
fn-dsa-vrfy = { workspace = true }
